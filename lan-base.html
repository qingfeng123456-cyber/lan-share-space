<script nonce="{{ js_nonce }}">
(function () {
  function translate() {
    var labels = {lead: '操作', href: '文件名', sz: '大小', ext: '类型', ts: '日期'};
    Object.keys(labels).forEach(function (key) {
      var element = document.querySelector('#files th[name="' + key + '"] > span');
      if (element && element.textContent !== labels[key]) element.textContent = labels[key];
    });
    document.querySelectorAll('#acc_info > span:not(#srv_info2)').forEach(function (element) {
      if (element.textContent === 'Read-Write-Move-Delete 权限') element.textContent = '查看、上传、修改和删除权限';
    });
    var disk = document.querySelector('#srv_info2 > span:nth-child(2)');
    if (disk) {
      var next = disk.textContent.replace(/([\d.]+\s+\w+) free of ([\d.]+\s+\w+)/, '可用 $1 / 总计 $2');
      if (disk.textContent !== next) disk.textContent = next;
    }
  }
  document.addEventListener('DOMContentLoaded', function () {
    translate();
    new MutationObserver(translate).observe(document.body, {childList: true, subtree: true});
  });
})();
</script>

<script nonce="{{ js_nonce }}">
(function () {
  function addInterface() {
    var ops = document.getElementById('ops');
    var wrap = document.getElementById('wrap');
    if (!ops || !wrap || document.getElementById('lan-brand')) return;

    var brand = document.createElement('div');
    brand.id = 'lan-brand';
    brand.innerHTML = '<div class="lan-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.2c.6 0 1.1.2 1.5.6l1.1 1.1c.4.4.9.6 1.5.6H18A2.5 2.5 0 0 1 20.5 9.8v7.7A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10Z" fill="currentColor" opacity=".35"/><path d="M3.5 10A2.5 2.5 0 0 1 6 7.5h12a2.5 2.5 0 0 1 2.5 2.5v7.5A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5V10Z" fill="currentColor"/></svg></div><div><div class="lan-brand-title">共享空间</div><div class="lan-brand-sub">LOCAL FILES</div></div><div class="lan-brand-status"><span></span>局域网已连接</div>';
    ops.parentNode.insertBefore(brand, ops);

    var intro = document.createElement('section');
    intro.id = 'lan-intro';
    intro.innerHTML = '<div class="lan-intro-copy"><div class="lan-eyebrow">共享空间 <span>/</span> 所有文件</div><h1>所有文件</h1><p>在一个地方，轻松分享与管理文件。</p></div><div class="lan-actions"><button type="button" class="lan-new"><span aria-hidden="true">＋</span> 新建文件夹</button><button type="button" class="lan-upload"><span aria-hidden="true">↑</span> 上传文件</button></div>';
    wrap.parentNode.insertBefore(intro, wrap);
    var previousPath = null;
    function syncFolder() {
      if (previousPath === location.pathname) return;
      previousPath = location.pathname;
      var parts = previousPath.split('/').filter(Boolean);
      var folder = parts.length ? parts[parts.length - 1] : '所有文件';
      try { folder = decodeURIComponent(folder); } catch (_) {}
      intro.querySelector('h1').textContent = folder;
      intro.querySelector('.lan-eyebrow').textContent = '共享空间 / ' + folder;
    }
    syncFolder();
    new MutationObserver(syncFolder).observe(wrap, {childList: true, subtree: true});
    window.addEventListener('popstate', syncFolder);
    var widget = document.getElementById('wtoggle');
    if (widget) {
      function translateActions() {
        var names = {'#fren span':'重命名', '#fdel span':'删除', '#fcut span':'剪切', '#fcpy span':'复制', '#fpst span':'粘贴', '#zip1 span':'打包', '#selall':'全选', '#selinv':'反选', '#selzip':'打包', '#seldl':'下载'};
        Object.keys(names).forEach(function (selector) {
          var target = widget.querySelector(selector);
          if (target && target.textContent !== names[selector]) target.textContent = names[selector];
        });
      }
      translateActions();
      new MutationObserver(translateActions).observe(widget, {childList:true, subtree:true});
    }
    intro.querySelector('.lan-upload').addEventListener('click', function () {
      var control = document.getElementById('opa_up');
      if (control) control.click();
    });
    intro.querySelector('.lan-new').addEventListener('click', function () {
      var control = document.getElementById('opa_mkd');
      if (control) control.click();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addInterface);
  else addInterface();
})();
</script>
